[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# let-chains (`if let ... && ...`) need 1.88.
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/Shadowtrap1/cubeharbor"
publish = false

[workspace.dependencies]
cubeharbor-core = { path = "crates/core" }
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
schemars = "1"
kube = { version = "5", default-features = false, features = ["client", "runtime", "derive", "rustls-tls"] }
k8s-openapi = { version = "0.29", features = ["latest"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
