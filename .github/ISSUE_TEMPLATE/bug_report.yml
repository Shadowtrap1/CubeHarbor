name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Security problems: please use **Security → Report a vulnerability** instead of an issue. Remove passwords and API keys from anything you paste."
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The MinecraftServer spec or compose file, and what you did.
      render: yaml
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Operator logs, and `kubectl logs <server>-0 -c install` for install problems.
      render: text
  - type: input
    id: version
    attributes:
      label: cubeharbor version
    validations: { required: true }
  - type: input
    id: cluster
    attributes:
      label: Kubernetes distribution and version
      placeholder: k3s v1.31, GKE 1.30, ...
