name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked
      - name: CRD is up to date
        run: |
          cargo run -q -p cubeharbor -- crd > /tmp/crd.yaml
          diff -u charts/cubeharbor/crds/minecraftservers.yaml /tmp/crd.yaml
      - uses: azure/setup-helm@v5
      - run: helm lint charts/cubeharbor && helm template t charts/cubeharbor > /dev/null

  images:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Build and push
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          TAG: ${{ github.ref_name }}
        run: |
          export REGISTRY=$(echo "$REGISTRY" | tr '[:upper:]' '[:lower:]') TAG=${TAG#v}
          docker buildx bake --push --set '*.platform=linux/amd64,linux/arm64'

  # The chart is published as an OCI artifact:
  #   helm install cubeharbor oci://ghcr.io/<owner>/charts/cubeharbor --version <x.y.z>
  chart:
    needs: images
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Package and push
        env:
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ github.ref_name }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -eu
          owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]') version=${TAG#v}
          echo "$TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          # Images default to this repository's registry, and the tag to the chart's appVersion.
          sed -i "s|^  registry: .*|  registry: ghcr.io/$owner|" charts/cubeharbor/values.yaml
          helm package charts/cubeharbor --version "$version" --app-version "$version" -d /tmp/chart
          helm push "/tmp/chart/cubeharbor-$version.tgz" "oci://ghcr.io/$owner/charts"
