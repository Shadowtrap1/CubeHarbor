                    maximum: 255.0
                    minimum: 0.0
                    nullable: true
                    type: integer
                  javaVersion:
                    description: Force a Java major version (8, 17, 21, 25).
                    maximum: 255.0
                    minimum: 0.0
                    nullable: true
                    type: integer
                type: object
              loader:
