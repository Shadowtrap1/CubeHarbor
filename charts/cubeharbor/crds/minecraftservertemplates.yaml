                    nullable: true
                    type: string
                type: object
              mods:
                description: Merged by Modrinth project or URL; a server's entry for the same mod replaces this one.
                items:
                  description: A single mod or plugin. Exactly one of `modrinth` or `url` should be set.
                  properties:
