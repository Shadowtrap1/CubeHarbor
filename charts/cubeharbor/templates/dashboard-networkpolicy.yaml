{{- /* Who may connect to the dashboard. On by default with cloudflareTunnel, so pods other than
cloudflared can't reach it and forge X-Forwarded-For from inside dashboard.trustedProxies. */ -}}
{{- $np := .Values.dashboard.networkPolicy -}}
{{- $enabled := $np.enabled -}}
{{- if kindIs "invalid" $enabled }}{{ $enabled = .Values.cloudflareTunnel.enabled }}{{ end -}}
{{- if and .Values.dashboard.enabled $enabled }}
{{- if and .Values.dashboard.ingress.enabled (empty $np.allowFrom) }}
{{- fail "dashboard.networkPolicy would block the Ingress controller: list it in dashboard.networkPolicy.allowFrom (e.g. a namespaceSelector for its namespace), or set dashboard.networkPolicy.enabled=false" }}
{{- end }}
{{- if and (.Values.dashboard.httpRoute | default dict).enabled (empty $np.allowFrom) }}
{{- fail "dashboard.networkPolicy would block the Gateway API implementation: list its pods in dashboard.networkPolicy.allowFrom (e.g. a namespaceSelector for its namespace), or set dashboard.networkPolicy.enabled=false" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cubeharbor.fullname" . }}-dashboard
  labels: {{- include "cubeharbor.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  podSelector:
    matchLabels: {{- include "cubeharbor.selector" . | nindent 6 }}
      app.kubernetes.io/component: dashboard
  policyTypes: [Ingress]
  {{- $metricsFrom := and .Values.metrics.enabled $np.metricsFrom }}
  {{- $appFrom := or .Values.cloudflareTunnel.enabled $np.allowFrom .Values.tests.enabled }}
  {{- if or $appFrom $metricsFrom }}
  ingress:
    {{- if $appFrom }}
    - from:
        {{- if .Values.cloudflareTunnel.enabled }}
        - podSelector:
            matchLabels: {{- include "cubeharbor.selector" . | nindent 14 }}
              app.kubernetes.io/component: cloudflared
        {{- end }}
        {{- if .Values.tests.enabled }}
        # The `helm test` pod. Minecraft server pods can't match: the operator always labels
        # them app.kubernetes.io/name=minecraft.
        - podSelector:
            matchLabels: {{- include "cubeharbor.selector" . | nindent 14 }}
              app.kubernetes.io/component: test
        {{- end }}
        {{- with $np.allowFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - { port: 8080, protocol: TCP }
    {{- end }}
    {{- if $metricsFrom }}
    # Prometheus: only the health port, which has no login page and no API.
    - from: {{- toYaml $np.metricsFrom | nindent 8 }}
      ports:
        - { port: 8081, protocol: TCP }
    {{- end }}
  {{- else }}
  # Nothing is listed: only kubectl port-forward (and the node, e.g. kubelet probes) reach it.
  ingress: []
  {{- end }}
{{- end }}
