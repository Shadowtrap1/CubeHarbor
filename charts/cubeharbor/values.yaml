# -- Image registry/prefix for all cubeharbor images.
image:
  registry: ghcr.io/shadowtrap1
  # -- Defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# -- Pod securityContext of the operator, gateway, dashboard and mc-router pods.
# On OpenShift set this to {} so the restricted SCC assigns the UID.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile: { type: RuntimeDefault }

network:
  # -- Address every component listens on: "0.0.0.0" (IPv4) or "::" (IPv6-only and dual-stack clusters).
  bindAddress: "0.0.0.0"
  # -- ipFamilyPolicy for every Service, including the gateway ports Service
  # (SingleStack, PreferDualStack, RequireDualStack). Cluster default when empty.
  ipFamilyPolicy: ""
  # -- ipFamilies for every Service, e.g. [IPv4, IPv6]. Cluster default when empty.
  ipFamilies: []

# -- Pod settings for every Minecraft server the operator creates. Use these to run servers on
# dedicated or tainted game nodes, pull from a private registry, or fit a platform's rules.
serverPods:
  # -- Added to the global imagePullSecrets (which server pods also get).
  imagePullSecrets: []
  # -- Merged with each server's spec.nodeSelector (the server wins), e.g. { kubernetes.io/arch: amd64 }.
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""
  runtimeClassName: ""
  labels: {}
  annotations: {}
  # -- Replaces the server pod securityContext. null = built-in (uid/gid 1000, Pod Security
  # "restricted"). {} on OpenShift, so the restricted SCC assigns the UID.
  securityContext: null

minecraft:
  # -- Accept the Minecraft EULA (https://aka.ms/MinecraftEULA) for every server by default.
  # Servers can still set `acceptEula` individually.
  acceptEula: false
  # -- Servers get `<name>.<baseDomain>` as their address unless they set routing.hostnames.
  # Point a wildcard DNS record (*.mc.example.com) at the gateway.
  baseDomain: ""
  # -- Hostname/IP players use for voice chat and Bedrock ports. Defaults to baseDomain.
  publicHost: ""
  # -- Public port pool for voice chat, Bedrock and other extra ports.
  portRange: "25600-25699"
  # -- Default storage class for world volumes (cluster default when empty).
  storageClass: ""
  # -- Parallel downloads when installing modpacks.
  downloadConcurrency: 16
  # -- CPU request of servers that don't set resources.cpu. Lower it on small clusters
  # (Raspberry Pi, single node); "0" sets no request.
  defaultCpuRequest: 500m
  # -- Only manage servers in this namespace (empty = all namespaces).
  watchNamespace: ""
  # -- Ingress class for HTTP extra ports (web maps).
  ingressClass: ""
  # -- Domains servers may claim for `expose: ingress` ports (default: baseDomain; any host when
  # both are empty). The dashboard's own host is always refused.
  ingressHostSuffixes: []
  # -- Let `spec.image` replace the cubeharbor server image. Off by default: anyone who can edit a
  # server could otherwise run arbitrary images in its namespace.
  allowImageOverride: false
  # -- With allowImageOverride, accept only images starting with one of these (empty = any).
  allowedImagePrefixes: []
  # -- Per-server NetworkPolicy: game and extra ports stay open, RCON only from the dashboard.
  # Needs a CNI that enforces NetworkPolicy (k3s does by default).
  rconNetworkPolicy: true

curseforge:
  # -- CurseForge API key (https://console.curseforge.com). Required for CurseForge modpacks.
  apiKey: ""
  # -- Or reference an existing secret with key `apiKey`.
  existingSecret: ""

cloudflareDdns:
  # Keep Cloudflare DNS records pointed at your public IPv4 address, for home installs whose ISP
  # changes it. The operator looks the address up every `interval` and only calls Cloudflare when
  # it changed (plus an hourly re-check that repairs records edited in Cloudflare). Records are created when missing and updated when wrong, always as "DNS only"
  # (proxied: false; Cloudflare's proxy can't carry Minecraft). Other records are left alone and
  # nothing is ever deleted. IPv4 (A records) only.
  enabled: false
  # -- Existing Secret with a Cloudflare API token (Zone > DNS > Edit on the zone). Required.
  # kubectl -n <ns> create secret generic cubeharbor-cloudflare-api --from-literal=apiToken=<token>
  existingSecret: ""
  # -- Key of the token in existingSecret.
  existingSecretKey: apiToken
  # -- Zone name (example.com) or zone ID. Required.
  zone: ""
  # -- Record names to manage (default: `*.<minecraft.baseDomain>`). Add `minecraft.publicHost`
  # here if it's a name in the zone, so voice chat / Bedrock addresses follow too. Names that
  # are CNAMEs (e.g. a Cloudflare Tunnel hostname) and the dashboard's host are never changed.
  records: []
  # -- Also publish servers' own `routing.hostnames` that fall inside the zone (names a
  # wildcard in `records` already covers are skipped). Records of deleted servers are kept.
  serverHostnames: false
  # -- How often to check the public IP (s, m or h; at least 30s).
  interval: 5m
  # -- TTL of the records, in seconds (1 = Cloudflare's automatic TTL, otherwise 60-86400).
  ttl: 1
  # -- URLs that answer with your public IPv4 as plain text, tried in order.
  ipLookupUrls:
    - https://api.ipify.org
    - https://ipv4.icanhazip.com

# -- Shared download cache (ReadWriteMany). Speeds up installing the same large modpack on several servers.
cache:
  enabled: false
  size: 50Gi
  storageClass: ""
  accessMode: ReadWriteMany

operator:
  # -- Must be 1: port allocation is coordinated inside the operator process.
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""
  logLevel: info

router:
  # -- Who routes Java players by hostname: `gateway` (cubeharbor-gateway, also answers pings for
  # sleeping servers) or `mc-router` (itzg/mc-router reading Service annotations). With
  # mc-router the gateway still forwards voice chat / Bedrock / extra ports.
  mode: gateway

mcRouter:
  # -- Pinned for reproducible installs; bump deliberately (https://github.com/itzg/mc-router/releases).
  image: itzg/mc-router:1.54.2
  # -- Start a sleeping server when a player joins (scales its StatefulSet 0 -> 1).
  autoScaleUp: true
  connectionRateLimit: ""
  extraEnv: []
  service:
    type: LoadBalancer
    # -- Public Java port. Use something other than 25565 when another router already owns it.
    port: 25565
    # -- Node port for the Java port when type is NodePort.
    nodePort: null
    externalTrafficPolicy: Local
    annotations: {}
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { memory: 128Mi }
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""

gateway:
  # -- More than one replica is supported; players are spread by the load balancer.
  replicas: 1
  # -- PodDisruptionBudget, created when replicas > 1 so node drains keep one gateway up.
  pdb:
    enabled: true
    minAvailable: 1
  # -- Bind directly on node ports instead of using a LoadBalancer (bare metal without a LB).
  hostNetwork: false
  service:
    type: LoadBalancer
    port: 25565
    # -- Node port for the Java port when type is NodePort.
    nodePort: null
    annotations: {}
    # -- Local preserves player IPs.
    externalTrafficPolicy: Local
    loadBalancerIP: ""
  # -- Set when the load balancer in front sends PROXY protocol.
  acceptProxyProtocol: false
  # -- CIDRs of those load balancers. PROXY headers from other peers are ignored, so players
  # can't spoof their IP. Empty = trust any peer (only safe if nothing else can reach the gateway).
  trustedProxies: []
  # -- Close player and forwarded TCP connections after this many seconds without traffic
  # (0 = never). Minecraft clients send keep-alives, so this only catches dead connections.
  idleTimeoutSeconds: 600
  # -- Concurrent connections on the Minecraft port, and on all forwarded TCP ports together.
  maxConnections: 4096
  maxForwardConnections: 1024
  resources:
    requests: { cpu: 50m, memory: 32Mi }
    limits: { memory: 256Mi }
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""

dashboard:
  enabled: true
  # -- Login password, at least 12 characters recommended. Generated (and kept across upgrades)
  # when empty. Set it here (`--set-string dashboard.password=...`), or keep it in your own
  # Secret with a `password` key via `existingSecret`.
  password: ""
  existingSecret: ""
  # -- Let a logged-in user change the password on the dashboard's Account page (it's written
  # back to the chart's Secret). If `password` is set here, the next `helm upgrade` restores it.
  # Always off with `existingSecret`, since that Secret's owner (External Secrets, SOPS, ...) would
  # revert the change. With `helm template`-based GitOps (Argo CD, Flux post-rendering) the Secret
  # is re-rendered on every sync, so turn this off there too.
  allowPasswordChange: true
  # -- Namespace for servers created from the dashboard (release namespace when empty).
  defaultNamespace: ""
  # -- Extra namespaces the dashboard may manage (RBAC is granted per namespace). `["*"]` grants
  # cluster-wide access, including get on every Secret: avoid unless you need it.
  allowedNamespaces: []
  # -- Mark the session cookie Secure. Always on when the dashboard Ingress has TLS or
  # cloudflareTunnel is enabled.
  cookieSecure: false
  # -- Other setups shown on the dashboard and in /api/v1/servers (read-only).
  # Each url returns a server list: games-dashboard /api/servers or another cubeharbor /api/v1/servers.
  remotes: []
  #  - name: games
  #    url: https://games.example.com/api/servers
  # -- Browser origins allowed to call /api (central dashboards on another host). `*` allows any.
  corsOrigins: []
  # -- Serve GET /api/v1/servers without logging in (for public status pages).
  publicServerList: false
  # -- CIDRs of proxies in front of the dashboard (e.g. the ingress controller's pod network).
  # Their X-Forwarded-For is believed when rate-limiting failed logins per client; without it,
  # all clients behind the proxy share one limit. With cloudflareTunnel, list the cluster's pod
  # CIDR (k3s: 10.42.0.0/16; see `kubectl get nodes -o jsonpath='{.items[*].spec.podCIDR}'`) and
  # keep service.type ClusterIP, so only in-cluster proxies can reach the dashboard.
  trustedProxies: []
  # -- Failed logins per minute across all clients before every login gets 429 (0 = no global
  # limit; each client is always limited to 10 a minute). Lower slows distributed guessing of a
  # weak password; 0 means nobody can block other people's logins.
  loginMaxFailuresTotal: 100
  # -- Branding, theme and form defaults of the dashboard. Every key is optional; anything left
  # out keeps the built-in default. All options with their defaults: examples/site.yaml.
  site: {}
  #  name: Blockhaus
  #  icon: "🧱"
  #  logoUrl: https://example.com/logo.svg
  #  faviconUrl: https://example.com/favicon.png
  #  footer: "Run by the Blockhaus admins"
  #  theme: { accent: "#7c5cff", bg: "#101014", panel: "#18181f" }
  #  customCss: "header { border-bottom-width: 2px }"
  #  links:
  #    - { label: Map, url: https://map.example.com, newTab: true }
  #  refreshSeconds: 5
  #  newServer:
  #    memory: 6Gi
  #    memoryOptions: [4Gi, 6Gi, 8Gi, 12Gi, 16Gi]
  #    autoSleepMinutes: 20
  #    voice: true
  # -- NetworkPolicy that only lets cloudflared (with cloudflareTunnel) and `allowFrom` connect to
  # the dashboard. Without it, any pod (including Minecraft servers running third-party plugins)
  # could reach it from inside trustedProxies and forge X-Forwarded-For to dodge the per-client
  # login limit. null = on with cloudflareTunnel, off otherwise. Needs a CNI that enforces
  # NetworkPolicy (k3s does by default). kubectl port-forward and the node itself are not affected.
  networkPolicy:
    enabled: null
    # -- More NetworkPolicyPeers allowed in: your ingress controller (required when
    # dashboard.ingress is enabled), or another cubeharbor release in the cluster that lists this
    # dashboard in its `remotes`. No cubeharbor component calls the dashboard itself.
    # - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } }
    allowFrom: []
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: false
    className: ""
    host: cubeharbor.example.com
    annotations: {}
    tls: []
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { memory: 256Mi }
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""

# -- Reach the dashboard from outside your network through a Cloudflare Tunnel: cloudflared
# dials out to Cloudflare, so no router port is opened for the dashboard. Only the dashboard
# (HTTP) goes through it: players still connect to the gateway directly (port forward + DNS,
# see cloudflareDdns). Put Cloudflare Access in front of the hostname. Setup: README,
# "Remote access with Cloudflare Tunnel".
cloudflareTunnel:
  enabled: false
  # -- `token`: remotely-managed tunnel, public hostnames are configured in the Cloudflare
  # dashboard and the Secret holds the tunnel token. `local`: locally-managed tunnel, the Secret
  # holds the tunnel's credentials.json and the chart renders the ingress rules below.
  mode: token
  # -- Existing Secret with the tunnel token (or credentials.json for mode=local). Required: the
  # chart never takes the token as a value. E.g.
  # `kubectl -n cubeharbor create secret generic cubeharbor-cloudflare-tunnel --from-literal=token=<token>`.
  existingSecret: ""
  # -- Key in existingSecret (default `token`, or `credentials.json` for mode=local).
  existingSecretKey: ""
  # -- Public hostname of the dashboard, e.g. dash.example.com. Required for mode=local (it's the
  # ingress rule); with mode=token it's informational. Either way servers can't claim it with
  # `expose: ingress`.
  hostname: ""
  # -- mode=local: the tunnel's UUID (`cloudflared tunnel list`).
  tunnelId: ""
  # -- mode=local: more ingress rules, inserted after the dashboard's and before the final 404,
  # e.g. a web map: `- { hostname: map.example.com, service: "http://lobby-map.minecraft.svc:8100" }`.
  extraIngress: []
  # -- mode=local: top-level originRequest settings (https://developers.cloudflare.com/cloudflare-one/connections/connect-networks/configure-tunnels/cloudflared-parameters/origin-parameters/).
  # Don't set httpHostHeader for the dashboard: it checks the browser's Origin against Host.
  originRequest: {}
  # -- Pinned for reproducible installs; bump deliberately (https://github.com/cloudflare/cloudflared/releases).
  image: cloudflare/cloudflared:2026.10.7
  # -- Each replica holds its own connections to Cloudflare; 2 keeps the dashboard reachable
  # while one restarts.
  replicas: 2
  # -- Edge transport: auto (default, QUIC with HTTP/2 fallback), quic or http2. Use http2 if
  # your network blocks outbound UDP 7844.
  protocol: ""
  # -- Extra `cloudflared tunnel` flags, e.g. [--loglevel=debug].
  extraArgs: []
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""

# -- MinecraftServer resources to create with the release (full spec, see examples/).
servers: {}
