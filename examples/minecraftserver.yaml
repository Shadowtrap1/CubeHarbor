# The raw custom resource (what compose files and the dashboard produce).
apiVersion: cubeharbor.dev/v1alpha1
kind: MinecraftServer
metadata:
  name: survival
  namespace: cubeharbor
spec:
  acceptEula: true
  modpack:
    modrinth:
      project: cobblemon-fabric
  resources:
    memory: 8Gi
    storage: 30Gi
  routing:
    hostnames: [survival.mc.example.com]
  voice:
    kind: simple-voice-chat
  geyser: {}
  autoSleep:
    idleMinutes: 15
  ops: [Steve]
  # Optional scheduling for this server only. nodeSelector is merged with the chart's
  # serverPods.nodeSelector and tolerations are added to serverPods.tolerations; affinity and
  # priorityClassName replace serverPods.affinity / serverPods.priorityClassName.
  # nodeSelector: { pool: games }
  # tolerations:
  #   - { key: dedicated, operator: Equal, value: minecraft, effect: NoSchedule }
  # affinity:
  #   nodeAffinity:
  #     requiredDuringSchedulingIgnoredDuringExecution:
  #       nodeSelectorTerms:
  #         - matchExpressions: [{ key: node.kubernetes.io/instance-type, operator: In, values: [c7i.2xlarge] }]
  # priorityClassName: game-servers
